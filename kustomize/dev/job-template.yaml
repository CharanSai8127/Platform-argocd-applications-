apiVersion: batch/v1
kind: Job
metadata:
  name: backend-prestart
  namespace: dev
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prestart
          image: your-backend-image:dev
          command: ["sh", "-c"]
          args:
            - |
              echo "Running prestart tasks..."
              python prestart.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi


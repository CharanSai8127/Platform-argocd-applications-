apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300   # 5 minutes sustained load
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180            # add 1 pod every 3 minutes max
    scaleDown:
      stabilizationWindowSeconds: 600   # wait 10 minutes before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

